<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillSphere - Fee & Payment Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- ============================= -->
    <!-- Navbar -->
    <!-- ============================= -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand fw-bold">
                SkillSphere - Admin
            </span>

            <a
                href="/admin-dashboard.html"
                class="btn btn-light">

                Dashboard

            </a>

        </div>

    </nav>


    <!-- ============================= -->
    <!-- Main Content -->
    <!-- ============================= -->

    <div class="container mt-5">


        <!-- Header -->

        <div class="d-flex justify-content-between
                    align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    💰 Fee & Payment Management
                </h2>

                <p class="text-muted mb-0">
                    Manage student fees and payments.
                </p>

            </div>


            <button
                class="btn btn-primary"
                onclick="openAddPaymentModal()">

                ➕ Add Payment

            </button>

        </div>



        <!-- ============================= -->
        <!-- Error Message -->
        <!-- ============================= -->

        <div
            id="errorMessage"
            class="alert alert-danger d-none">
        </div>



        <!-- ============================= -->
        <!-- Summary Cards -->
        <!-- ============================= -->

        <div class="row g-4 mb-5">


            <!-- Total Payments -->

            <div class="col-md-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Total Payments
                        </h6>

                        <h2
                            id="totalPayments"
                            class="fw-bold">

                            0

                        </h2>

                    </div>

                </div>

            </div>


            <!-- Paid -->

            <div class="col-md-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Paid
                        </h6>

                        <h2
                            id="paidPayments"
                            class="fw-bold text-success">

                            0

                        </h2>

                    </div>

                </div>

            </div>


            <!-- Pending / Partial -->

            <div class="col-md-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Pending / Partial
                        </h6>

                        <h2
                            id="pendingPayments"
                            class="fw-bold text-warning">

                            0

                        </h2>

                    </div>

                </div>

            </div>

        </div>



        <!-- ============================= -->
        <!-- Search -->
        <!-- ============================= -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-body">

                <div class="row g-3 align-items-end">

                    <div class="col-md-6">

                        <label class="form-label">

                            Search by Student ID

                        </label>

                        <input
                            type="number"
                            id="searchStudentId"
                            class="form-control"
                            placeholder="Enter student ID">

                    </div>


                    <div class="col-md-3">

                        <button
                            class="btn btn-primary w-100"
                            onclick="searchPayments()">

                            🔎 Search

                        </button>

                    </div>


                    <div class="col-md-3">

                        <button
                            class="btn btn-secondary w-100"
                            onclick="loadPayments()">

                            🔄 Show All

                        </button>

                    </div>

                </div>

            </div>

        </div>



        <!-- ============================= -->
        <!-- Payments Table -->
        <!-- ============================= -->

        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <h5 class="fw-bold mb-3">

                    Payment Records

                </h5>


                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle">

                        <thead class="table-primary">

                            <tr>

                                <th>ID</th>

                                <th>Student ID</th>

                                <th>Total Fee</th>

                                <th>Amount Paid</th>

                                <th>Balance</th>

                                <th>Method</th>

                                <th>Status</th>

                                <th>Date</th>

                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="paymentsTable">

                            <tr>

                                <td
                                    colspan="9"
                                    class="text-center">

                                    Loading payments...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


    </div>



    <!-- ================================= -->
    <!-- ADD PAYMENT MODAL -->
    <!-- ================================= -->

    <div
        class="modal fade"
        id="addPaymentModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">


                <!-- Header -->

                <div class="modal-header">

                    <h5 class="modal-title">

                        ➕ Add Payment

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>



                <!-- Body -->

                <div class="modal-body">


                    <!-- Student ID -->

                    <div class="mb-3">

                        <label class="form-label">

                            Student ID

                        </label>

                        <input
                            type="number"
                            id="studentId"
                            class="form-control"
                            placeholder="Enter student ID">

                    </div>


                    <!-- Total Fee -->

                    <div class="mb-3">

                        <label class="form-label">

                            Total Fee

                        </label>

                        <input
                            type="number"
                            id="totalFee"
                            class="form-control"
                            placeholder="Enter total fee"
                            min="1"
                            step="0.01">

                    </div>


                    <!-- Amount Paid -->

                    <div class="mb-3">

                        <label class="form-label">

                            Amount Paid

                        </label>

                        <input
                            type="number"
                            id="amountPaid"
                            class="form-control"
                            placeholder="Enter amount paid"
                            min="0"
                            step="0.01">

                    </div>


                    <!-- Payment Method -->

                    <div class="mb-3">

                        <label class="form-label">

                            Payment Method

                        </label>

                        <select
                            id="paymentMethod"
                            class="form-select">

                            <option value="">
                                Select payment method
                            </option>

                            <option value="CASH">
                                CASH
                            </option>

                            <option value="UPI">
                                UPI
                            </option>

                            <option value="CARD">
                                CARD
                            </option>

                            <option value="BANK_TRANSFER">
                                BANK TRANSFER
                            </option>

                        </select>

                    </div>


                </div>



                <!-- Footer -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="savePayment()">

                        Save Payment

                    </button>

                </div>


            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- ================================= -->
    <!-- JavaScript -->
    <!-- ================================= -->

    <script>


        // ==========================================
        // JWT
        // ==========================================

        const accessToken =
            localStorage.getItem("accessToken");

        const userData =
            localStorage.getItem("user");


        // ==========================================
        // Login Check
        // ==========================================

        if (!accessToken || !userData) {

            window.location.href =
                "/login.html";

        }



        // ==========================================
        // Load Payments
        // ==========================================

        async function loadPayments() {

            try {

                const response =
                    await fetch(
                        "/api/payments",
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + accessToken,

                                "Content-Type":
                                    "application/json"

                            }

                        }
                    );


                // Unauthorized

                if (response.status === 401) {

                    localStorage.removeItem(
                        "accessToken"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    window.location.href =
                        "/login.html";

                    return;

                }


                // Forbidden

                if (response.status === 403) {

                    showError(
                        "Access denied. ADMIN permission required."
                    );

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to load payments."
                    );

                }


                const payments =
                    await response.json();


                displayPayments(payments);


            }
            catch (error) {

                console.error(
                    "Payment loading error:",
                    error
                );

                showError(
                    "Unable to load payments: "
                    + error.message
                );

            }

        }



        // ==========================================
        // Display Payments
        // ==========================================

        function displayPayments(payments) {

            const table =
                document.getElementById(
                    "paymentsTable"
                );


            table.innerHTML = "";


            // Summary

            document.getElementById(
                "totalPayments"
            ).textContent =
                payments.length;


            const paidCount =
                payments.filter(
                    payment =>
                        payment.paymentStatus === "PAID"
                ).length;


            const pendingCount =
                payments.filter(
                    payment =>
                        payment.paymentStatus !== "PAID"
                ).length;


            document.getElementById(
                "paidPayments"
            ).textContent =
                paidCount;


            document.getElementById(
                "pendingPayments"
            ).textContent =
                pendingCount;



            // No payments

            if (
                !payments ||
                payments.length === 0
            ) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="9"
                            class="text-center text-muted">

                            No payment records found.

                        </td>

                    </tr>

                `;

                return;

            }



            // Create rows

            payments.forEach(function(payment) {

                const row =
                    document.createElement("tr");


                let statusBadge;


                if (
                    payment.paymentStatus ===
                    "PAID"
                ) {

                    statusBadge = `
                        <span
                            class="badge bg-success">
                            PAID
                        </span>
                    `;

                }
                else if (
                    payment.paymentStatus ===
                    "PARTIAL"
                ) {

                    statusBadge = `
                        <span
                            class="badge bg-warning text-dark">
                            PARTIAL
                        </span>
                    `;

                }
                else {

                    statusBadge = `
                        <span
                            class="badge bg-danger">
                            PENDING
                        </span>
                    `;

                }


                row.innerHTML = `

                    <td>
                        ${payment.id}
                    </td>

                    <td>
                        ${payment.studentId}
                    </td>

                    <td>
                        ₹${payment.totalFee}
                    </td>

                    <td>
                        ₹${payment.amountPaid}
                    </td>

                    <td>
                        ₹${payment.balance}
                    </td>

                    <td>
                        ${payment.paymentMethod}
                    </td>

                    <td>
                        ${statusBadge}
                    </td>

                    <td>
                        ${formatDate(
                            payment.paymentDate
                        )}
                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-danger"
                            onclick="deletePayment(
                                ${payment.id}
                            )">

                            🗑️

                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        }



        // ==========================================
        // Add Payment Modal
        // ==========================================

        function openAddPaymentModal() {

            document.getElementById(
                "studentId"
            ).value = "";


            document.getElementById(
                "totalFee"
            ).value = "";


            document.getElementById(
                "amountPaid"
            ).value = "";


            document.getElementById(
                "paymentMethod"
            ).value = "";


            const modal =
                new bootstrap.Modal(
                    document.getElementById(
                        "addPaymentModal"
                    )
                );


            modal.show();

        }



        // ==========================================
        // Save Payment
        // ==========================================

        async function savePayment() {

            const studentId =
                document.getElementById(
                    "studentId"
                ).value;


            const totalFee =
                document.getElementById(
                    "totalFee"
                ).value;


            const amountPaid =
                document.getElementById(
                    "amountPaid"
                ).value;


            const paymentMethod =
                document.getElementById(
                    "paymentMethod"
                ).value;



            // Validation

            if (
                !studentId ||
                !totalFee ||
                amountPaid === "" ||
                !paymentMethod
            ) {

                alert(
                    "Please fill all fields."
                );

                return;

            }


            if (
                Number(amountPaid) >
                Number(totalFee)
            ) {

                alert(
                    "Amount paid cannot be greater than total fee."
                );

                return;

            }



            try {

                const response =
                    await fetch(
                        "/api/payments",
                        {
                            method: "POST",

                            headers: {

                                "Authorization":
                                    "Bearer " + accessToken,

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                studentId:
                                    Number(studentId),

                                totalFee:
                                    Number(totalFee),

                                amountPaid:
                                    Number(amountPaid),

                                paymentMethod:
                                    paymentMethod

                            })

                        }
                    );


                if (response.status === 401) {

                    localStorage.removeItem(
                        "accessToken"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (response.status === 403) {

                    alert(
                        "Access denied. ADMIN permission required."
                    );

                    return;

                }


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText
                    );

                }


                alert(
                    "Payment added successfully!"
                );


                // Close modal

                const modalElement =
                    document.getElementById(
                        "addPaymentModal"
                    );


                const modal =
                    bootstrap.Modal.getInstance(
                        modalElement
                    );


                modal.hide();


                // Refresh table

                await loadPayments();


            }
            catch (error) {

                console.error(
                    "Payment save error:",
                    error
                );


                alert(
                    "Unable to save payment: "
                    + error.message
                );

            }

        }



        // ==========================================
        // Search Payments
        // ==========================================

        async function searchPayments() {

            const studentId =
                document.getElementById(
                    "searchStudentId"
                ).value;


            if (!studentId) {

                alert(
                    "Enter a Student ID."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/payments/student/${studentId}`,
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + accessToken

                            }

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to search payments."
                    );

                }


                const payments =
                    await response.json();


                displayPayments(payments);


            }
            catch (error) {

                console.error(
                    "Payment search error:",
                    error
                );


                showError(
                    error.message
                );

            }

        }



        // ==========================================
        // Delete Payment
        // ==========================================

        async function deletePayment(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this payment?"
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/payments/${id}`,
                        {
                            method: "DELETE",

                            headers: {

                                "Authorization":
                                    "Bearer " + accessToken

                            }

                        }
                    );


                if (response.status === 401) {

                    localStorage.removeItem(
                        "accessToken"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (response.status === 403) {

                    alert(
                        "Access denied. ADMIN permission required."
                    );

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to delete payment."
                    );

                }


                alert(
                    "Payment deleted successfully!"
                );


                await loadPayments();


            }
            catch (error) {

                console.error(
                    "Delete payment error:",
                    error
                );


                alert(
                    "Unable to delete payment: "
                    + error.message
                );

            }

        }



        // ==========================================
        // Format Date
        // ==========================================

        function formatDate(dateValue) {

            if (!dateValue) {

                return "-";

            }


            const date =
                new Date(dateValue);


            return date.toLocaleString();

        }



        // ==========================================
        // Error
        // ==========================================

        function showError(message) {

            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            errorMessage.textContent =
                message;


            errorMessage.classList.remove(
                "d-none"
            );

        }



        // ==========================================
        // Initial Load
        // ==========================================

        loadPayments();


    </script>

</body>

</html>
