<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillSphere - Audit Logs</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand fw-bold">
                SkillSphere - Admin
            </span>

            <a
                href="/admin-dashboard.html"
                class="btn btn-light">

                Admin Dashboard

            </a>

        </div>

    </nav>



    <!-- Main Content -->

    <div class="container mt-5">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                <h2 class="fw-bold">
                    📋 Audit Logs
                </h2>

                <p class="text-muted">
                    Monitor user activity and system events.
                </p>

                <hr>


                <!-- Error Message -->

                <div
                    id="errorMessage"
                    class="alert alert-danger d-none">
                </div>


                <!-- Audit Table -->

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-primary">

                            <tr>

                                <th>ID</th>

                                <th>User ID</th>

                                <th>Action</th>

                                <th>Description</th>

                                <th>Timestamp</th>

                            </tr>

                        </thead>


                        <tbody id="auditTable">

                            <tr>

                                <td
                                    colspan="5"
                                    class="text-center">

                                    Loading audit logs...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>



    <script>

        // ==============================
        // Check Login
        // ==============================

        const token =
            localStorage.getItem("accessToken");

        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            window.location.href =
                "/login.html";

        }



        // ==============================
        // Load Audit Logs
        // ==============================

        async function loadAuditLogs() {

            try {

                const response =
                    await fetch(
                        "/api/audit",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                // Unauthorized / forbidden

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    window.location.href =
                        "/dashboard.html";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to load audit logs"
                    );

                }


                const logs =
                    await response.json();


                const table =
                    document.getElementById(
                        "auditTable"
                    );


                table.innerHTML = "";


                // No logs

                if (logs.length === 0) {

                    table.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                class="text-center text-muted">

                                No audit logs found.

                            </td>

                        </tr>

                    `;

                    return;

                }


                // Display logs

                logs.forEach(function(log) {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${log.id}
                        </td>

                        <td>
                            ${log.userId}
                        </td>

                        <td>

                            <span class="badge bg-primary">
                                ${log.action}
                            </span>

                        </td>

                        <td>
                            ${log.description}
                        </td>

                        <td>
                            ${log.timestamp}
                        </td>

                    `;


                    table.appendChild(row);

                });

            }


            catch (error) {

                console.error(error);


                const errorMessage =
                    document.getElementById(
                        "errorMessage"
                    );


                errorMessage.textContent =
                    error.message;


                errorMessage.classList.remove(
                    "d-none"
                );

            }

        }



        // Load audit logs

        loadAuditLogs();

    </script>


</body>

</html>
