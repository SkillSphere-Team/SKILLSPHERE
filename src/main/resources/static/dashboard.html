<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillSphere - Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand fw-bold">
                SkillSphere
            </span>

            <button
                id="logoutBtn"
                class="btn btn-light">

                Logout

            </button>

        </div>

    </nav>


    <!-- Dashboard -->

    <div class="container mt-5">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                <h2 class="fw-bold">

                    Welcome,
                    <span id="userName"></span>! 👋

                </h2>

                <p class="text-muted">

                    Welcome to your SkillSphere dashboard.

                </p>

                <hr>


                <div class="row mt-4">


                    <!-- Courses -->

                    <div class="col-md-4 mb-3">

                        <div class="card border-0 shadow-sm">

                            <div class="card-body">

                                <h5>
                                    My Courses
                                </h5>

                                <p class="text-muted">
                                    View your courses
                                </p>

                            </div>

                        </div>

                    </div>


                    <!-- Assignments -->

                    <div class="col-md-4 mb-3">

                        <div class="card border-0 shadow-sm">

                            <div class="card-body">

                                <h5>
                                    Assignments
                                </h5>

                                <p class="text-muted">
                                    View your assignments
                                </p>

                            </div>

                        </div>

                    </div>


                    <!-- Profile -->

                    <div class="col-md-4 mb-3">

                        <div class="card border-0 shadow-sm">

                            <div class="card-body">

                                <h5>
                                    Profile
                                </h5>

                                <div
                                    id="profileInfo"
                                    class="text-muted">

                                    Loading profile...

                                </div>

                            </div>

                        </div>

                    </div>


                </div>

            </div>

        </div>

    </div>


<script>

    // ==============================
    // Check Login / JWT
    // ==============================

    const accessToken =
        localStorage.getItem("accessToken");

    const userData =
        localStorage.getItem("user");


    // If JWT or user information is missing,
    // send the user back to login page

    if (!accessToken || !userData) {

        window.location.href = "/login.html";

    } else {

        const user =
            JSON.parse(userData);

        document
            .getElementById("userName")
            .textContent =
            user.firstName;
    }



    // ==============================
    // JWT API Helper
    // ==============================

    async function apiFetch(url, options = {}) {

        const token =
            localStorage.getItem("accessToken");


        // If token doesn't exist,
        // redirect to login

        if (!token) {

            window.location.href =
                "/login.html";

            return;
        }


        // Add JWT Authorization header

        options.headers = {

            ...options.headers,

            "Authorization":
                "Bearer " + token,

            "Content-Type":
                "application/json"
        };


        const response =
            await fetch(url, options);


        // Token expired / invalid

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            localStorage.removeItem(
                "accessToken"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "/login.html";

            return;
        }


        return response;
    }



    // ==============================
    // Load Profile
    // ==============================

async function loadProfile() {

    try {

        const response =
            await apiFetch(
                "/api/users/me"
            );

        if (!response) {
            return;
        }

        const data =
            await response.json();

        document
            .getElementById("profileInfo")
            .innerHTML = `

                <strong>Name:</strong>
                ${data.firstName} ${data.lastName}

                <br>

                <strong>Email:</strong>
                ${data.email}

                <br>

                <strong>Phone:</strong>
                ${data.phone}

                <br>

                <strong>Role:</strong>
                ${data.roles.join(", ")}

                <br>

                <strong>Status:</strong>
                ${data.active ? "Active" : "Inactive"}

            `;

    } catch (error) {

        console.error(
            "Profile loading error:",
            error
        );

        document
            .getElementById("profileInfo")
            .textContent =
            "Unable to load profile.";
    }
}

    // Load profile when dashboard opens

    loadProfile();



    // ==============================
    // Logout
    // ==============================

    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "accessToken"
                );

                localStorage.removeItem(
                    "user"
                );

                window.location.href =
                    "/login.html";

            }
        );

</script>
</body>

</html>
