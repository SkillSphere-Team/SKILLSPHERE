<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillSphere - Roles & Permissions</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand fw-bold">
                SkillSphere - Admin
            </span>

            <a
                href="/admin-dashboard.html"
                class="btn btn-light">

                Admin Dashboard

            </a>

        </div>

    </nav>



    <!-- Main Content -->

    <div class="container mt-5">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                <h2 class="fw-bold">
                    🔐 Roles & Permissions
                </h2>

                <p class="text-muted">
                    View the roles available in SkillSphere.
                </p>

                <hr>


                <!-- Error Message -->

                <div
                    id="errorMessage"
                    class="alert alert-danger d-none">
                </div>


                <!-- Roles -->

                <div
                    id="rolesContainer"
                    class="row g-4">

                    <div class="text-center">

                        Loading roles...

                    </div>

                </div>

            </div>

        </div>

    </div>



    <script>

        // ==============================
        // Check Login
        // ==============================

        const token =
            localStorage.getItem("accessToken");

        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            window.location.href =
                "/login.html";

        }



        // ==============================
        // Load Roles
        // ==============================

        async function loadRoles() {

            try {

                const response =
                    await fetch(
                        "/api/roles",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                // Not authorized

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    window.location.href =
                        "/dashboard.html";

                    return;
                }


                // Other errors

                if (!response.ok) {

                    throw new Error(
                        "Unable to load roles"
                    );

                }


                // Read response

                const roles =
                    await response.json();


                const container =
                    document.getElementById(
                        "rolesContainer"
                    );


                container.innerHTML = "";


                // Display each role

                roles.forEach(function(role) {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "col-md-4";


                    card.innerHTML = `

                        <div class="card h-100 border-0 shadow-sm">

                            <div class="card-body text-center p-4">

                                <h4 class="fw-bold">
                                    ${role}
                                </h4>

                                <p class="text-muted">
                                    ${getRoleDescription(role)}
                                </p>

                            </div>

                        </div>

                    `;


                    container.appendChild(card);

                });

            }


            catch (error) {

                console.error(error);


                const errorMessage =
                    document.getElementById(
                        "errorMessage"
                    );


                errorMessage.textContent =
                    error.message;


                errorMessage.classList.remove(
                    "d-none"
                );

            }

        }



        // ==============================
        // Role Descriptions
        // ==============================

        function getRoleDescription(role) {

            switch (role) {

                case "ADMIN":

                    return "Full system administration access.";


                case "TRAINER":

                    return "Training and course management access.";


                case "STUDENT":

                    return "Student learning and course access.";


                case "HR":

                    return "Human resources related access.";


                case "EVALUATOR":

                    return "Assessment and evaluation access.";


                default:

                    return "System role.";

            }

        }



        // ==============================
        // Load Roles When Page Opens
        // ==============================

        loadRoles();

    </script>


</body>

</html>
